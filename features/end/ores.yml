# ============================================================
# AETHERIA — features/end/ores.yml
# Minerales del End.
# ============================================================

end_ores:
  type: ORE
  blocks:
    - minecraft:end_stone: 8
    - minecraft:obsidian: 1
    - minecraft:crying_obsidian: 0.5
  sampler:
    type: EXPRESSION
    expression: |
      simplex(x / 10, y / 6, z / 10) > 0.55 ? 1 : 0
  density: 0.25
  min-y: 0
  max-y: 128
  replace:
    - minecraft:end_stone

