# ============================================================
# AETHERIA — biomes/end/central.yml
# Isla del Dragón, su borde, el Dragon Pit y el vacío circundante.
# ============================================================

ENDRA_DRAGON_ISLAND:
  type: BIOME
  extends: ABSTRACT_BASE
  vanilla: minecraft:the_end
  colors: $biomes/colors.yml:ENDRA_DRAGON_ISLAND
  terrain:
    sampler:
      type: EXPRESSION
      expression: |
        base = 64;
        noise = simplex(x / 60, z / 60) * 2.0 + simplex(x / 15, z / 15) * 0.5;
        base + noise
    height: 64
    base: 40
  palette:
    - BLOCK:minecraft:end_stone: 255
    - BLOCK:minecraft:obsidian: 120
    - BLOCK:minecraft:crying_obsidian: 60
    - BLOCK:minecraft:stone: 0
  features:
    trees:
      - structures/end/obsidian_pillar.yml
      - structures/end/end_crystal.yml
    flora:
      - features/end/chorus_plant.yml
    ores:
      - ores/end/end_ores.yml

ENDRA_DRAGON_ISLAND_EDGE:
  type: BIOME
  extends: ABSTRACT_BASE
  vanilla: minecraft:the_end
  colors: $biomes/colors.yml:ENDRA_DRAGON_ISLAND_EDGE
  terrain:
    sampler:
      type: EXPRESSION
      expression: |
        base = 60;
        noise = simplex(x / 50, z / 50) * 3.0 + simplex(x / 12, z / 12) * 0.8;
        base + noise
    height: 60
    base: 40
  palette:
    - BLOCK:minecraft:end_stone: 255
    - BLOCK:minecraft:obsidian: 100
    - BLOCK:minecraft:crying_obsidian: 50
    - BLOCK:minecraft:stone: 0
  features:
    trees:
      - structures/end/obsidian_pillar_small.yml
    flora:
      - features/end/chorus_plant.yml
    ores:
      - ores/end/end_ores.yml

ENDRA_DRAGON_PIT:
  type: BIOME
  extends: ABSTRACT_BASE
  vanilla: minecraft:the_end
  colors: $biomes/colors.yml:ENDRA_DRAGON_PIT
  terrain:
    sampler:
      type: EXPRESSION
      expression: |
        base = 30;
        noise = simplex(x / 40, z / 40) * 1.0 + simplex(x / 10, z / 10) * 0.2;
        base + noise
    height: 30
    base: 20
  palette:
    - BLOCK:minecraft:bedrock: 255
    - BLOCK:minecraft:obsidian: 180
    - BLOCK:minecraft:crying_obsidian: 120
    - BLOCK:minecraft:stone: 0
  features:
    trees:
      - structures/end/dragon_nest.yml
    flora:
      - features/end/dragon_breath.yml
    ores:
      - ores/end/end_ores.yml

ENDRA_VOID:
  type: BIOME
  extends: ABSTRACT_BASE
  vanilla: minecraft:the_end
  colors: $biomes/colors.yml:ENDRA_VOID
  terrain:
    sampler:
      type: EXPRESSION
      expression: |
        base = 0;
        noise = 0;
        base + noise
    height: 0
    base: 0
  palette:
    - BLOCK:minecraft:air: 255
    - BLOCK:minecraft:void_air: 0
  features: {}
"""

with open(f"{base}/end/central.yml", "w") as f:
    f.write(end_central)

print(f"✓ end/central.yml creado ({len(end_central)} caracteres)")

