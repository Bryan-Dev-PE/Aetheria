# ==========================================
# AETHERIA — Overworld: Ruinas Antiguas
# Estructura semi-sumergida de una civilización perdida
# ==========================================

id: AETHERIA_OW_ANCIENT_RUINS
type: STRUCTURE

locator:
  type: RANDOM
  height: 20-80
  rarity: 0.005
  spacing: 48
  separation: 12
  biomes:
    - plains
    - forest
    - jungle
    - desert

scripts:
  - id: "ancient_ruins_main"
    file: "structures/scripts/ancient_ruins.tesf"
    palette: AETHERIA_OW_PLAINS

structure:
  layout:
    type: RUIN
    size: 12x6x12
    rooms: 3-6
    corridors: true

  materials:
    walls:
      "minecraft:stone_bricks": 5
      "minecraft:mossy_stone_bricks": 3
      "minecraft:cracked_stone_bricks": 2
      "minecraft:chiseled_stone_bricks": 1
    floors:
      "minecraft:stone_bricks": 3
      "minecraft:cracked_stone_bricks": 2
      "minecraft:cobblestone": 2
      "minecraft:mossy_cobblestone": 1
    pillars:
      "minecraft:stone_brick_wall": 2
      "minecraft:cobblestone_wall": 1
      "minecraft:mossy_cobblestone_wall": 1

  features:
    - type: SPAWNER
      mob: "minecraft:zombie"
      position: center_room
      chance: 0.4

    - type: SPAWNER
      mob: "minecraft:skeleton"
      position: corridor
      chance: 0.3

    - type: LOOT_CHEST
      loot-table: "minecraft:chests/simple_dungeon"
      count: 2-4
      position: room_corners

    - type: DECAYED_FURNACE
      material: "minecraft:furnace"
      position: random_room
      chance: 0.2

  decay:
    enabled: true
    level: 0.4-0.8
    collapse-chance: 0.15
    vegetation-overgrowth:
      enabled: true
      types: ["minecraft:vine", "minecraft:moss_block", "minecraft:grass"]
      coverage: 0.3
