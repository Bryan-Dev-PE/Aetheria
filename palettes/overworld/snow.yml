# ==========================================
# AETHERIA — Overworld: Biomas Nevados
# ==========================================

id: AETHERIA_OW_SNOW
type: PALETTE

extends: AETHERIA_BASE_STONE

surface:
  top:
    materials:
      "minecraft:snow_block": 4
      "minecraft:powder_snow": 2
      "minecraft:packed_ice": 2
      "minecraft:ice": 1
      "minecraft:snow": 1
    layers: 2-4
  
  sub:
    materials:
      "minecraft:dirt": 3
      "minecraft:stone": 2
      "minecraft:coarse_dirt": 1
    layers: 2

# Capa de nieve adicional
snow-cover:
  materials:
    "minecraft:snow": 1
  layers: 1
  coverage: 0.9

# Picos de hielo
ice-spikes:
  materials:
    "minecraft:packed_ice": 3
    "minecraft:ice": 2
    "minecraft:blue_ice": 1
  type: SPIKE
  rarity: 0.15
  height: 3-15
  radius: 1-3

# Lagos congelados
frozen-lakes:
  materials:
    "minecraft:ice": 1
    "minecraft:packed_ice": 1
    "minecraft:snow_block": 1
  type: LAKE
  rarity: 0.1
  radius: 5-15

# Abetos
spruce-trees:
  materials:
    "minecraft:spruce_log[axis=y]": 1
    "minecraft:spruce_leaves[persistent=true]": 1
  type: TREE
  rarity: 0.3
  height: 6-12