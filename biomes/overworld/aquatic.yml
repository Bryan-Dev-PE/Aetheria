# ============================================================
# AETHERIA — biomes/overworld/aquatic.yml
# Todos los biomas acuáticos del Overworld.
# ============================================================

AETHERIA_OCEAN:
  type: BIOME
  extends: ABSTRACT_BASE
  vanilla: minecraft:ocean
  colors: $biomes/colors.yml:AETHERIA_OCEAN
  terrain:
    sampler:
      type: EXPRESSION
      expression: |
        base = 45;
        noise = simplex(x / 100, z / 100) * 2.0 + simplex(x / 25, z / 25) * 0.5;
        base + noise
    height: 45
    base: 30
  palette:
    - BLOCK:minecraft:sand: 255
    - BLOCK:minecraft:gravel: 100
    - BLOCK:minecraft:clay: 60
    - BLOCK:minecraft:stone: 0
  features:
    flora:
      - features/overworld/seagrass.yml
      - features/overworld/kelp.yml
    ores:
      - ores/overworld/coal.yml
      - ores/overworld/iron.yml

