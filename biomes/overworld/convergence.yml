# ============================================================
# AETHERIA — biomes/overworld/convergence.yml
# Biomas híbridos donde otras dimensiones se filtran en el Overworld.
# ============================================================

AETHERIA_SCORCHED_PLAINS:
  type: BIOME
  extends: ABSTRACT_BASE
  vanilla: minecraft:savanna
  colors: $biomes/colors.yml:AETHERIA_SCORCHED_PLAINS
  terrain:
    sampler:
      type: EXPRESSION
      expression: |
        base = 64;
        noise = simplex(x / 70, z / 70) * 2.0 + simplex(x / 18, z / 18) * 0.5;
        base + noise
    height: 64
    base: 60
  palette:
    - BLOCK:minecraft:grass_block: 255
    - BLOCK:minecraft:coarse_dirt: 120
    - BLOCK:minecraft:magma_block: 80
    - BLOCK:minecraft:blackstone: 60
    - BLOCK:minecraft:netherrack: 40
    - BLOCK:minecraft:stone: 0
  features:
    trees:
      - structures/overworld/dead_oak.yml
      - structures/overworld/charred_bush.yml
    flora:
      - features/overworld/dead_bush.yml
      - features/overworld/nether_wart.yml
      - features/overworld/crimson_roots.yml
    ores:
      - ores/overworld/coal.yml
      - ores/overworld/iron.yml
      - ores/overworld/gold.yml
    postprocessors:
      - features/overworld/ash_particles.yml

