# ============================================================
# AETHERIA — biomes/nether/vanilla_reworked.yml
# Biomas vanilla del Nether reimaginados por Tartarus.
# ============================================================

NETHERRA_FLAMING_HELLSCAPES:
  type: BIOME
  extends: ABSTRACT_BASE
  vanilla: minecraft:nether_wastes
  colors: $biomes/colors.yml:NETHERRA_FLAMING_HELLSCAPES
  terrain:
    sampler:
      type: EXPRESSION
      expression: |
        base = 64;
        noise = simplex(x / 60, z / 60) * 2.0 + simplex(x / 15, z / 15) * 0.5;
        base + noise
    height: 64
    base: 32
  palette:
    - BLOCK:minecraft:netherrack: 255
    - BLOCK:minecraft:nether_bricks: 120
    - BLOCK:minecraft:cracked_nether_bricks: 80
    - BLOCK:minecraft:chiseled_nether_bricks: 40
    - BLOCK:minecraft:blackstone: 60
    - BLOCK:minecraft:magma_block: 40
    - BLOCK:minecraft:stone: 0
  features:
    trees:
      - structures/nether/nether_fortress.yml
      - structures/nether/bastion_remnant.yml
    flora:
      - features/nether/fire.yml
      - features/nether/soul_fire.yml
    ores:
      - ores/nether/nether_gold.yml
      - ores/nether/quartz.yml
      - ores/nether/ancient_debris.yml
    postprocessors:
      - features/nether/ash_particles.yml

