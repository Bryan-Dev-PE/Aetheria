  # End: más comunes
  ENDRA_END_HIGHLANDS: 1.5
  ENDRA_SHATTERED_END: 1.5
  ENDRA_DARK_END: 1.5
  ENDRA_HANGING_ISLES: 1.3
  ENDRA_CHORAL_DEADLANDS: 1.3
  ENDRA_AMETHYST_END: 1.4
  ENDRA_TAINTED_END: 1.4
  ENDRA_STYGIAN_BARRENS: 1.3
  ENDRA_CRAGGY_END: 1.3
  ENDRA_SHATTERED_FOREST: 1.2
  ENDRA_CHORUVE_WOODS: 1.5
  ENDRA_MAUVE_JUNGLE: 1.4
  ENDRA_TWISTED_GROVE: 1.4
  ENDRA_END_WILDS: 1.3
  ENDRA_CRIM_THICKET: 1.3
  ENDRA_IVORY_EMPYREAN: 1.5
  ENDRA_ROSETTE_POOLS: 1.5
