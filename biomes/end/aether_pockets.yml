# ============================================================
# AETHERIA — biomes/end/aether_pockets.yml
# Islas flotantes tipo Overworld en el vacío del End.
# Basado en: ReimagEND (Aureus, RogueShade / PolyhedralDev)
# ============================================================

ENDRA_AETHER_AZURE_MEADOWS:
  type: BIOME
  extends: ABSTRACT_BASE
  vanilla: minecraft:plains
  colors: $biomes/colors.yml:ENDRA_AETHER_AZURE_MEADOWS
  terrain:
    sampler:
      type: EXPRESSION
      expression: |
        base = 100;
        noise = simplex(x / 60, z / 60) * 2.0 + simplex(x / 15, z / 15) * 0.5;
        base + noise
    height: 100
    base: 80
  palette:
    - BLOCK:minecraft:grass_block: 255
    - BLOCK:minecraft:dirt: 70
    - BLOCK:minecraft:end_stone: 80
    - BLOCK:minecraft:stone: 0
  features:
    trees:
      - structures/end/aether_oak.yml
    flora:
      - features/end/aether_grass.yml
      - features/end/azure_bluet.yml
    ores:
      - ores/end/end_ores.yml

