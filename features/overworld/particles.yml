ash_particles:
  type: PARTICLE
  particle: minecraft:ash
  sampler:
    type: EXPRESSION
    expression: |
      simplex(x / 20, y / 10, z / 20) > 0.3 ? 1 : 0
  density: 0.4
  min-y: 0
  max-y: 128

