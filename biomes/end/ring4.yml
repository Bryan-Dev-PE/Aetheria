# ============================================================
# AETHERIA — biomes/end/ring4.yml
# Anillo 4: Paraíso (3200+ bloques)
# Llanuras hermosas, colores brillantes, abundancia.
# ============================================================

ENDRA_IVORY_EMPYREAN:
  type: BIOME
  extends: ABSTRACT_BASE
  vanilla: minecraft:end_highlands
  colors: $biomes/colors.yml:ENDRA_IVORY_EMPYREAN
  terrain:
    sampler:
      type: EXPRESSION
      expression: |
        base = 70;
        noise = simplex(x / 60, z / 60) * 1.5 + simplex(x / 15, z / 15) * 0.3;
        base + noise
    height: 70
    base: 40
  palette:
    - BLOCK:minecraft:quartz_block: 255
    - BLOCK:minecraft:smooth_quartz: 180
    - BLOCK:minecraft:end_stone: 120
    - BLOCK:minecraft:stone: 0
  features:
    trees:
      - structures/end/ivory_tree.yml
    flora:
      - features/end/ivory_grass.yml
      - features/end/chorus_plant.yml
    ores:
      - ores/end/end_ores.yml

