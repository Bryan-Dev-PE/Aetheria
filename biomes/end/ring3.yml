# ============================================================
# AETHERIA — biomes/end/ring3.yml
# Anillo 3: Vida (2200-3200 bloques)
# Bosques densos, junglas, vegetación exuberante.
# ============================================================

ENDRA_CHORUVE_WOODS:
  type: BIOME
  extends: ABSTRACT_BASE
  vanilla: minecraft:end_highlands
  colors: $biomes/colors.yml:ENDRA_CHORUVE_WOODS
  terrain:
    sampler:
      type: EXPRESSION
      expression: |
        base = 68;
        noise = simplex(x / 55, z / 55) * 2.5 + simplex(x / 14, z / 14) * 0.6;
        base + noise
    height: 68
    base: 40
  palette:
    - BLOCK:minecraft:end_stone: 255
    - BLOCK:minecraft:chorus_plant: 180
    - BLOCK:minecraft:purpur_block: 100
    - BLOCK:minecraft:stone: 0
  features:
    trees:
      - structures/end/chorus_tree.yml
      - structures/end/chorus_tree_large.yml
      - structures/end/chorus_grove.yml
    flora:
      - features/end/chorus_plant_dense.yml
      - features/end/chorus_flower.yml
    ores:
      - ores/end/end_ores.yml

