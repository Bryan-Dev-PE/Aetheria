# ============================================================
# AETHERIA — biomes/nether/caves.yml
# Cuevas personalizadas del Nether.
# ============================================================

NETHERRA_LUSH_NETHER_CAVERNS:
  type: BIOME
  extends: ABSTRACT_BASE
  vanilla: minecraft:warped_forest
  colors: $biomes/colors.yml:NETHERRA_LUSH_NETHER_CAVERNS
  terrain:
    sampler:
      type: EXPRESSION
      expression: |
        base = 40;
        noise = simplex(x / 40, y / 20, z / 40) * 3.0 + simplex(x / 10, y / 5, z / 10) * 0.8;
        base + noise
    height: 40
    base: 20
  palette:
    - BLOCK:minecraft:moss_block: 255
    - BLOCK:minecraft:mossy_cobblestone: 180
    - BLOCK:minecraft:stone: 120
    - BLOCK:minecraft:netherrack: 80
    - BLOCK:minecraft:stone: 0
  features:
    trees:
      - structures/nether/glow_berry_vines.yml
    flora:
      - features/nether/glow_lichen.yml
      - features/nether/moss_carpet.yml
      - features/nether/spore_blossom.yml
    ores:
      - ores/nether/nether_gold.yml
      - ores/nether/quartz.yml

