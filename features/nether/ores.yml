# ============================================================
# AETHERIA — features/nether/ores.yml
# Minerales del Nether.
# ============================================================

nether_gold:
  type: ORE
  blocks:
    - minecraft:nether_gold_ore: 1
  sampler:
    type: EXPRESSION
    expression: |
      simplex(x / 8, y / 6, z / 8) > 0.55 ? 1 : 0
  density: 0.3
  min-y: 10
  max-y: 117
  replace:
    - minecraft:netherrack
    - minecraft:blackstone
    - minecraft:basalt

