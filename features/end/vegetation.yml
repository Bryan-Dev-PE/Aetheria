# ============================================================
# AETHERIA — features/end/vegetation.yml
# Vegetación del End: chorus, flores endémicas, etc.
# ============================================================

chorus_plant:
  type: FLORA
  blocks:
    - minecraft:chorus_plant: 1
    - minecraft:chorus_flower: 0.3
  sampler:
    type: EXPRESSION
    expression: |
      simplex(x / 6, z / 6) > 0.3 ? 1 : 0
  density: 0.4
  y-offset: 1

