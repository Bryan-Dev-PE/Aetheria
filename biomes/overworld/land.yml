# ==========================================
# TIERRAS TEMPLADAS
# ==========================================

AETHERIA_MEADOWS:
  type: BIOME
  extends: ABSTRACT_BASE
  vanilla: minecraft:meadow
  colors: $biomes/colors.yml:AETHERIA_MEADOWS
  terrain:
    sampler:
      type: EXPRESSION
      expression: |
        base = 64;
        noise = simplex(x / 60, z / 60) * 1.5 + simplex(x / 15, z / 15) * 0.3;
        base + noise
    height: 64
    base: 60
  palette:
    - BLOCK:minecraft:grass_block: 255
    - BLOCK:minecraft:dirt: 70
    - BLOCK:minecraft:stone: 0
  features:
    trees:
      - structures/overworld/oak_bush.yml
      - structures/overworld/birch_bush.yml
      - structures/overworld/single_oak.yml
    flora:
      - features/overworld/tall_grass.yml
      - features/overworld/azure_bluet.yml
      - features/overworld/oxeye_daisy.yml
      - features/overworld/cornflower.yml
      - features/overworld/poppy.yml
      - features/overworld/dandelion.yml
    ores:
      - ores/overworld/coal.yml
      - ores/overworld/iron.yml
      - ores/overworld/copper.yml

