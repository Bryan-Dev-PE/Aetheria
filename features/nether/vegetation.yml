fire:
  type: FLORA
  blocks:
    - minecraft:fire: 1
  sampler:
    type: EXPRESSION
    expression: |
      simplex(x / 6, z / 6) > 0.4 ? 1 : 0
  density: 0.3
  y-offset: 1

