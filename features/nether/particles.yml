ash_particles:
  type: PARTICLE
  particle: minecraft:ash
  sampler:
    type: EXPRESSION
    expression: |
      simplex(x / 15, y / 8, z / 15) > 0.3 ? 1 : 0
  density: 0.5
  min-y: 0
  max-y: 128

