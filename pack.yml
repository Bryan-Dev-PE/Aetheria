id: AETHERIA
version: 1.0.0
author: "Community Convergence Pack"

# Soporte para las 3 dimensiones en un solo pack
generator: NOISE_3D

# Configuración por dimensión (Terra 6.4+)
dimensions:
  overworld:
    vanilla: "minecraft:overworld"
    vanilla-generation: "minecraft:overworld"
    biomes: $biome-distribution/stages/overworld_distribution.yml:biomes
  nether:
    vanilla: "minecraft:the_nether"
    vanilla-generation: "minecraft:nether"
    biomes: $biome-distribution/stages/nether_distribution.yml:biomes
  the_end:
    vanilla: "minecraft:the_end"
    vanilla-generation: "minecraft:end"
    biomes: $biome-distribution/stages/end_distribution.yml:biomes

addons:
  biome-provider-pipeline: "2.+"
  biome-provider-single: "1.+"
  biome-provider-image: "1.+"
  biome-provider-extrusion: "1.+"
  chunk-generator-noise-3d: "1.+"
  config-biome: "1.+"
  config-flora: "1.+"
  config-noise-function: "1.+"
  config-ore: "1.+"
  config-palette: "1.+"
  config-distributors: "1.+"
  config-locators: "1.+"
  config-feature: "1.+"
  structure-terrascript-loader: "1.+"
  structure-sponge-loader: "1.+"
  language-yaml: "1.+"
  generation-stage-feature: "1.+"
  structure-function-check-noise-3d: "1.+"
  palette-block-shortcut: "1.+"
  structure-block-shortcut: "1.+"
  terrascript-function-sampler: "1.+"

# Stages globales aplicables a las 3 dimensiones
stages:
  - id: global-preprocessors
    type: FEATURE
  - id: preprocessors
    type: FEATURE
  - id: landforms
    type: FEATURE
  - id: slabs
    type: FEATURE
  - id: ores
    type: FEATURE
  - id: deposits
    type: FEATURE
  - id: trees
    type: FEATURE
  - id: flora
    type: FEATURE
  - id: dimensional-fractures    # NUEVO: fracturas entre dimensiones
    type: FEATURE
  - id: postprocessors
    type: FEATURE

functions:
  "<<":
    - math/functions/terrace.yml:functions
    - math/functions/lerp.yml:functions
    - math/functions/maskSmooth.yml:functions
    - math/functions/dimensionalBlend.yml:functions  # Función de mezcla dimensional

samplers:
  "<<":
    - math/samplers/simplex.yml:samplers
    - math/samplers/spots.yml:samplers
    - math/samplers/fractureNoise.yml:samplers        # Ruido para fracturas

blend:
  palette:
    resolution: 2
    amplitude: 2
    sampler:
      type: WHITE_NOISE

slant:
  calculation-method: DotProduct