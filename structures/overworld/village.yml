# ==========================================
# AETHERIA — Overworld: Aldea
# ==========================================

id: AETHERIA_OW_VILLAGE
type: STRUCTURE

locator:
  type: RANDOM
  height: 50-100
  rarity: 0.008
  spacing: 32
  separation: 8
  biomes:
    - plains
    - desert
    - savanna
    - snowy
    - taiga

scripts:
  - id: "village_main"
    file: "structures/scripts/village.tesf"
    palette: AETHERIA_OW_PLAINS

structure:
  layout:
    type: VILLAGE
    size: 30x10x30
    houses: 6-12
    paths: true
    well: true
    farm: true

  house-types:
    - type: SMALL_HOUSE
      count: 2-4
      size: 5x4x5
      beds: 1-2
    
    - type: LARGE_HOUSE
      count: 1-2
      size: 7x5x7
      beds: 2-4
    
    - type: LIBRARY
      count: 0-1
      size: 7x5x7
      bookshelves: true
    
    - type: BLACKSMITH
      count: 0-1
      size: 7x5x7
      furnace: true
      lava-pool: true
    
    - type: CHURCH
      count: 0-1
      size: 5x8x5
      tower: true
    
    - type: BUTCHER
      count: 0-1
      size: 5x4x5
      smoker: true
    
    - type: FLETCHER
      count: 0-1
      size: 5x4x5
      fletching-table: true
    
    - type: FARM
      count: 1-3
      size: 7x3x7
      crops:
        - "minecraft:wheat"
        - "minecraft:carrots"
        - "minecraft:potatoes"
        - "minecraft:beetroots"

  features:
    - type: VILLAGER
      mob: "minecraft:villager"
      count: 4-10
      professions: random
    
    - type: IRON_GOLEM
      mob: "minecraft:iron_golem"
      count: 0-1
      position: village_center
    
    - type: LOOT_CHEST
      loot-table: "minecraft:chests/village/village_plains_house"
      count: 2-4
      position: house_interiors
    
    - type: BELL
      material: "minecraft:bell"
      position: village_center
      chance: 0.8