# ==========================================
# AETHERIA — Overworld: Ruinas de Sendero
# ==========================================

id: AETHERIA_OW_TRAIL_RUINS
type: STRUCTURE

locator:
  type: RANDOM
  height: 50-100
  rarity: 0.006
  spacing: 32
  separation: 8
  biomes:
    - taiga
    - snowy_taiga
    - old_growth_pine_taiga
    - old_growth_spruce_taiga

scripts:
  - id: "trail_ruins_main"
    file: "structures/scripts/trail_ruins.tesf"
    palette: AETHERIA_OW_FOREST

structure:
  layout:
    type: RUIN
    size: 15x6x15
    rooms: 3-6
    partially-buried: true

  materials:
    walls:
      "minecraft:mud_bricks": 4
      "minecraft:packed_mud": 3
      "minecraft:oak_planks": 2
      "minecraft:oak_log": 1
    floors:
      "minecraft:packed_mud": 3
      "minecraft:mud_bricks": 2
      "minecraft:coarse_dirt": 1
    accents:
      "minecraft:oak_stairs": 2
      "minecraft:oak_slab": 1
      "minecraft:terracotta": 1

  features:
    - type: SUSPICIOUS_GRAVEL
      material: "minecraft:suspicious_gravel"
      position: ruin_floor
      count: 10-20

    - type: SUSPICIOUS_SAND
      material: "minecraft:suspicious_sand"
      position: ruin_area
      count: 5-10

    - type: LOOT_CHEST
      loot-table: "minecraft:chests/trail_ruins_common"
      count: 1-2
      position: ruin_rooms

    - type: LOOT_CHEST
      loot-table: "minecraft:chests/trail_ruins_rare"
      count: 1
      position: hidden_chamber

    - type: DECORATED_POT
      material: "minecraft:decorated_pot"
      position: ruin_shelves
      count: 3-6
