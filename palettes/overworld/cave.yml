# ==========================================
# AETHERIA — Overworld: Cuevas
# ==========================================

id: AETHERIA_OW_CAVE
type: PALETTE

extends: AETHERIA_BASE_STONE

# Suelo de cueva
cave-floor:
  materials:
    "minecraft:stone": 5
    "minecraft:deepslate": 3
    "minecraft:gravel": 2
    "minecraft:dripstone_block": 1
  layers: 2

# Techos con estalactitas
cave-ceiling:
  materials:
    "minecraft:dripstone_block": 3
    "minecraft:stone": 2
    "minecraft:deepslate": 2
  layers: 1-3
  
  # Estalactitas colgantes
  decorations:
    - "minecraft:pointed_dripstone[thickness=tip,vertical_direction=down]": 1
    - "minecraft:pointed_dripstone[thickness=frustum,vertical_direction=down]": 2
    density: 0.3

# Lagos subterráneos
underground-pools:
  materials:
    "minecraft:water": 1
  type: POOL
  rarity: 0.2
  min-y: -48
  max-y: 16

# Cuevas de lush
lush-cave:
  materials:
    "minecraft:moss_block": 5
    "minecraft:moss_carpet": 3
    "minecraft:azalea": 1
    "minecraft:flowering_azalea": 1
    "minecraft:spore_ossom": 2
    "minecraft:small_dripleaf": 1
    "minecraft:big_dripleaf": 1
    "minecraft:hanging_roots": 2
    "minecraft:rooted_dirt": 2
  rarity: 0.08
  biomes: [lush_caves]

# Cuevas de dristone
dripstone-cave:
  materials:
    "minecraft:dripstone_block": 4
    "minecraft:pointed_dripstone": 3
    "minecraft:water": 1
    "minecraft:calcite": 1
  rarity: 0.06
  biomes: [dripstone_caves]

# Cuevas profundas (deep dark)
deep-dark:
  materials:
    "minecraft:sculk": 4
    "minecraft:sculk_catalyst": 1
    "minecraft:sculk_shrieker": 1
    "minecraft:sculk_sensor": 1
    "minecraft:sculk_vein": 3
  rarity: 0.04
  min-y: -64
  max-y: 0