star_particles:
  type: PARTICLE
  particle: minecraft:end_rod
  sampler:
    type: EXPRESSION
    expression: |
      simplex(x / 20, y / 10, z / 20) > 0.6 ? 1 : 0
  density: 0.2
  min-y: 0
  max-y: 128

