id: ENDRA_NETHERFRACTURE_ISLES
type: BIOME
vanilla: minecraft:end_highlands

colors:
  fog: 0x2a0a0a
  water: 0xff4500
  sky: 0x000000

terrain:
  sampler:
    type: EXPRESSION
    expression: |
      -1 +
      simplex(x / 50, z / 50) * 0.5 +
      simplex(x / 15, z / 15) * 0.25
  height: 80
  base: 64

palette:
  - BLOCK:minecraft:end_stone: 255
  - BLOCK:minecraft:netherrack: 120 # De Nether
  - BLOCK:minecraft:magma_block: 80 # De Nether
  - BLOCK:minecraft:blackstone: 60 # De Nether
  - BLOCK:minecraft:crimson_nylium: 40 # De Nether
  - BLOCK:minecraft:obsidian: 20
  - BLOCK:minecraft:lava: 0

features:
  trees:
    - structures/chorus_tree.yml
    - structures/crimson_fungus_end.yml # Hongos crimson adaptados
  flora:
    - features/chorus_flower.yml
    - features/nether_wart_end.yml
    - features/fire_patch.yml # Fuego eterno
  ores:
    - ores/end_ores.yml
  postprocessors:
    - features/lava_drips.yml # Goteo de lava desde islas
