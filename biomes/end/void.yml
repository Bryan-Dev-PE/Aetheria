# ============================================================
# AETHERIA — biomes/end/void.yml
# Biomas que aparecen en el vacío entre islas del End.
# ============================================================

ENDRA_STARFIELD:
  type: BIOME
  extends: ABSTRACT_BASE
  vanilla: minecraft:the_end
  colors: $biomes/colors.yml:ENDRA_STARFIELD
  terrain:
    sampler:
      type: EXPRESSION
      expression: |
        base = 0;
        noise = 0;
        base + noise
    height: 0
    base: 0
  palette:
    - BLOCK:minecraft:air: 255
    - BLOCK:minecraft:void_air: 0
  features:
    postprocessors:
      - features/end/star_particles.yml

ENDRA_ASTEROID_FIELD:
  type: BIOME
  extends: ABSTRACT_BASE
  vanilla: minecraft:the_end
  colors: $biomes/colors.yml:ENDRA_ASTEROID_FIELD
  terrain:
    sampler:
      type: EXPRESSION
      expression: |
        base = 0;
        noise = simplex(x / 30, z / 30) * 2.0;
        if(noise > 0.7, noise, 0)
    height: 0
    base: 0
  palette:
    - BLOCK:minecraft:end_stone: 255
    - BLOCK:minecraft:stone: 0
  features:
    trees:
      - structures/end/asteroid.yml
    ores:
      - ores/end/end_ores.yml

