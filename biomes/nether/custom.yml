# ============================================================
# AETHERIA — biomes/nether/custom.yml
# Biomas custom del Nether (Tartarus expansion).
# ============================================================

NETHERRA_BLOODY_REMNANTS:
  type: BIOME
  extends: ABSTRACT_BASE
  vanilla: minecraft:crimson_forest
  colors: $biomes/colors.yml:NETHERRA_BLOODY_REMNANTS
  terrain:
    sampler:
      type: EXPRESSION
      expression: |
        base = 64;
        noise = simplex(x / 55, z / 55) * 2.5 + simplex(x / 14, z / 14) * 0.6;
        base + noise
    height: 64
    base: 32
  palette:
    - BLOCK:minecraft:crimson_nylium: 255
    - BLOCK:minecraft:netherrack: 150
    - BLOCK:minecraft:red_nether_bricks: 100
    - BLOCK:minecraft:nether_wart_block: 80
    - BLOCK:minecraft:blackstone: 60
    - BLOCK:minecraft:stone: 0
  features:
    trees:
      - structures/nether/crimson_fungus.yml
      - structures/nether/crimson_fungus_large.yml
    flora:
      - features/nether/crimson_roots.yml
      - features/nether/nether_wart.yml
    ores:
      - ores/nether/nether_gold.yml
      - ores/nether/quartz.yml

