AETHERIA_LUSH_CAVES:
  type: BIOME
  extends: ABSTRACT_BASE
  vanilla: minecraft:lush_caves
  colors: $biomes/colors.yml:AETHERIA_LUSH_CAVES
  terrain:
    sampler:
      type: EXPRESSION
      expression: |
        base = 20;
        noise = simplex(x / 40, y / 20, z / 40) * 3.0 + simplex(x / 10, y / 5, z / 10) * 0.8;
        base + noise
    height: 20
    base: -10
  palette:
    - BLOCK:minecraft:moss_block: 255
    - BLOCK:minecraft:mossy_cobblestone: 150
    - BLOCK:minecraft:stone: 80
    - BLOCK:minecraft:dirt: 60
    - BLOCK:minecraft:stone: 0
  features:
    trees:
      - structures/overworld/azalea_tree.yml
    flora:
      - features/overworld/moss_carpet.yml
      - features/overworld/spore_blossom.yml
      - features/overworld/glow_berry_vines.yml
      - features/overworld/small_dripleaf.yml
      - features/overworld/big_dripleaf.yml
      - features/overworld/cave_vines.yml
    ores:
      - ores/overworld/coal.yml
      - ores/overworld/iron.yml
      - ores/overworld/copper.yml

