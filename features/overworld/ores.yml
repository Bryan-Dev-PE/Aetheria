# ============================================================
# AETHERIA — features/overworld/ores.yml
# Minerales del Overworld.
# ============================================================

coal:
  type: ORE
  blocks:
    - minecraft:coal_ore: 1
  sampler:
    type: EXPRESSION
    expression: |
      simplex(x / 12, y / 8, z / 12) > 0.55 ? 1 : 0
  density: 0.3
  min-y: 0
  max-y: 128
  replace:
    - minecraft:stone
    - minecraft:deepslate

