# --- HIERBA ---
tall_grass:
  type: FLORA
  blocks:
    - minecraft:tall_grass: 1
  sampler:
    type: EXPRESSION
    expression: |
      simplex(x / 8, z / 8) > 0.3 ? 1 : 0
  density: 0.6
  y-offset: 1

