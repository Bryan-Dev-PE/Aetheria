# ============================================================
# AETHERIA — biomes/end/ring2.yml
# Anillo 2: Transición (1500-2200 bloques)
# Vegetación básica, colores más vivos.
# ============================================================

ENDRA_AMETHYST_END:
  type: BIOME
  extends: ABSTRACT_BASE
  vanilla: minecraft:end_highlands
  colors: $biomes/colors.yml:ENDRA_AMETHYST_END
  terrain:
    sampler:
      type: EXPRESSION
      expression: |
        base = 68;
        noise = simplex(x / 55, z / 55) * 2.5 + simplex(x / 14, z / 14) * 0.6;
        base + noise
    height: 68
    base: 40
  palette:
    - BLOCK:minecraft:amethyst_block: 255
    - BLOCK:minecraft:budding_amethyst: 120
    - BLOCK:minecraft:end_stone: 150
    - BLOCK:minecraft:calcite: 80
    - BLOCK:minecraft:stone: 0
  features:
    trees:
      - structures/end/amethyst_spire.yml
    flora:
      - features/end/amethyst_cluster.yml
      - features/end/chorus_plant.yml
    ores:
      - ores/end/end_ores.yml

