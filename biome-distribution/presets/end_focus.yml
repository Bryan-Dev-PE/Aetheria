# ============================================================
# AETHERIA — Preset: END_FOCUS
# Enfocado en End. Overworld y Nether presentes pero reducidos.
# Ideal para servidores con énfasis en el vacío, islas flotantes
# y exploración del Outer End.
# Basado en: ReimagEND (Aureus, RogueShade / PolyhedralDev)
# ============================================================

id: END_FOCUS
description: "End expandido con Overworld y Nether reducidos."
author: "AETHERIA Team"
version: "1.0.0"

# --- Configuración de dimensiones ---
dimensions:
  overworld:
    enabled: true
    stage: $biome-distribution/stages/overworld_distribution.yml:biomes
    weight: 0.6 # Reducido

  nether:
    enabled: true
    stage: $biome-distribution/stages/nether_distribution.yml:biomes
    weight: 0.7 # Reducido

  the_end:
    enabled: true
    stage: $biome-distribution/stages/end_distribution.yml:biomes
    weight: 1.5 # Más peso

# --- Configuración de fracturas ---
fractures:
  enabled: true
  global-rarity: 0.15 # Muchas fracturas para conectar con End
  blend-intensity: 0.7

  overworld:
    nether-fracture: false
    end-fracture: true
  nether:
    overworld-fracture: false
    end-fracture: true
  end:
    overworld-fracture: true
    nether-fracture: true

# --- Configuración de estructuras ---
structures:
  overworld:
    vanilla: true
    custom: false
    fracture-structures: false
  nether:
    vanilla: true
    custom: false
    fracture-structures: false
  end:
    vanilla: true
    custom: true
    fracture-structures: true

# --- Configuración de ores ---
ores:
  overworld:
    vanilla: true
    custom: false
  nether:
    vanilla: true
    custom: false
  end:
    vanilla: true
    custom: true

# --- Configuración de vegetación ---
flora:
  overworld:
    vanilla: true
    custom: false
    density: 0.7
  nether:
    vanilla: true
    custom: false
    density: 0.8
  end:
    vanilla: true
    custom: true
    density: 1.3 # Más vegetación del End

# --- Configuración de cuevas ---
caves:
  overworld:
    enabled: true
    vanilla-caves: true
    custom-cave-biomes: false
    density: 0.8
  nether:
    enabled: true
    vanilla-caves: true
    custom-cave-biomes: false
    density: 0.8
  end:
    enabled: false

# --- Configuración de ríos ---
rivers:
  overworld:
    enabled: true
    width: 6
    depth: 3
  nether:
    enabled: false
  end:
    enabled: false

# --- Configuración de islas flotantes ---
floating-islands:
  overworld:
    enabled: true
    rarity: 0.08
    min-height: 40
    max-height: 120
  nether:
    enabled: false
  end:
    enabled: true

# --- Configuración de Aether Pockets (End) ---
aether-pockets:
  enabled: true
  rarity: 0.40 # MUCHOS Aether Pockets
  biomes:
    - ENDRA_AETHER_AZURE_MEADOWS
    - ENDRA_AETHER_CLARET_GROVE
    - ENDRA_AETHER_WISPY_ISLES
    - ENDRA_AETHER_BRAMBLE_WILDS
    - ENDRA_AETHER_GOLDEN_FIELDS
    - ENDRA_AETHER_FROSTBITE_WOODS
    - ENDRA_AETHER_HONEY_HEIGHTS
    - ENDRA_AETHER_ORCHARD_WOODLANDS
    - ENDRA_AETHER_FRIGID_BLUFFS
    - ENDRA_AETHER_PRISMATIC_RIDGES

# --- Configuración de Rings of Life (End) ---
rings-of-life:
  enabled: true
  # Anillos más amplios para más variedad
  ring-1-start: 800
  ring-1-end: 1400
  ring-2-start: 1400
  ring-2-end: 2000
  ring-3-start: 2000
  ring-3-end: 3000
  ring-4-start: 3000
  ring-4-end: 50000

# --- Configuración de Dragon Pit ---
dragon-pit:
  enabled: true
  radius: 50 # Más grande
  depth: 25

# --- Biomas desactivados ---
disabled-biomes:
  # Overworld: simplificar
  - AETHERIA_FLOATING_ISLES
  - AETHERIA_FOLIAGE_FORTRESS
  - AETHERIA_GLOOMY_GORGE
  - AETHERIA_SNOWY_SPIRES
  - AETHERIA_CRYSTAL_CAVERNS
  - AETHERIA_MOSSY_CAVERNS
  - AETHERIA_MAGMA_CAVERNS

  # Nether: simplificar
  - NETHERRA_THE_BOUNDARY
  - NETHERRA_CRYSTALLINE_VELDTS
  - NETHERRA_OVERGROWN_CAVERNS
  - NETHERRA_END_TAINTED
  - NETHERRA_OVERWORLD_REMNANTS
  - NETHERRA_AETHER_POCKETS

# --- Biomas con rareza modificada ---
biome-rarity:
  # Overworld: menos comunes
  AETHERIA_MEADOWS: 0.7
  AETHERIA_FOREST: 0.7
  AETHERIA_PLAINS: 0.7
