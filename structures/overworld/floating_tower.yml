# ==========================================
# AETHERIA — Overworld: Torre Flotante
# Estructura que emerge de las islas flotantes
# ==========================================

id: AETHERIA_OW_FLOATING_TOWER
type: STRUCTURE

locator:
  type: RANDOM
  height: 100-200
  rarity: 0.003
  spacing: 64
  separation: 16
  biomes:
    - AETHERIA_FLOATING_ISLES

scripts:
  - id: "floating_tower_main"
    file: "structures/scripts/floating_tower.tesf"
    palette: AETHERIA_FLOATING_ISLES

structure:
  layout:
    type: TOWER
    height: 15-35
    base-radius: 4-6
    top-radius: 2-3
    taper: true
  
  materials:
    walls:
      "minecraft:stone_bricks": 4
      "minecraft:mossy_stone_bricks": 2
      "minecraft:cracked_stone_bricks": 2
      "minecraft:chiseled_stone_bricks": 1
      "minecraft:amethyst_block": 1
    floors:
      "minecraft:stone_bricks": 3
      "minecraft:polished_andesite": 2
      "minecraft:cracked_stone_bricks": 1
    accents:
      "minecraft:amethyst_cluster": 2
      "minecraft:calcite": 2
      "minecraft:smooth_stone": 1
  
  floors:
    count: 3-6
    height-per-floor: 4-5
    windows: true
    balcony-chance: 0.3
  
  top:
    type: OBSERVATORY
    materials:
      "minecraft:glass": 3
      "minecraft:amethyst_block": 2
      "minecraft:calcite": 1
    beacon:
      material: "minecraft:beacon"
      chance: 0.2
  
  features:
    - type: LOOT_CHEST
      loot-table: "minecraft:chests/abandoned_mineshaft"
      count: 2-3
      position: floor_centers
    
    - type: SPAWNER
      mob: "minecraft:phantom"
      position: top_floor
      chance: 0.5
    
    - type: ENDER_CHEST
      position: top_observatory
      chance: 0.1