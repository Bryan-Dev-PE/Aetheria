# ============================================================
# AETHERIA — Preset: NETHER_FOCUS
# Enfocado en Nether. Overworld y End presentes pero reducidos.
# Ideal para servidores con énfasis en el inframundo y exploración subterránea.
# Basado en: Tartarus (JaddotWuzHere / PolyhedralDev)
# ============================================================

id: NETHER_FOCUS
description: "Nether expandido con Overworld y End reducidos."
author: "AETHERIA Team"
version: "1.0.0"

# --- Configuración de dimensiones ---
dimensions:
  overworld:
    enabled: true
    stage: $biome-distribution/stages/overworld_distribution.yml:biomes
    weight: 0.7 # Reducido

  nether:
    enabled: true
    stage: $biome-distribution/stages/nether_distribution.yml:biomes
    weight: 1.5 # Más peso

  the_end:
    enabled: true
    stage: $biome-distribution/stages/end_distribution.yml:biomes
    weight: 0.6 # Reducido

# --- Configuración de fracturas ---
fractures:
  enabled: true
  global-rarity: 0.15 # Muchas fracturas para conectar con OW
  blend-intensity: 0.7

  overworld:
    nether-fracture: true
    end-fracture: false
  nether:
    overworld-fracture: true
    end-fracture: true
  end:
    overworld-fracture: false
    nether-fracture: true

# --- Configuración de estructuras ---
structures:
  overworld:
    vanilla: true
    custom: false
    fracture-structures: true
  nether:
    vanilla: true
    custom: true
    fracture-structures: true
  end:
    vanilla: true
    custom: false
    fracture-structures: false

# --- Configuración de ores ---
ores:
  overworld:
    vanilla: true
    custom: false
  nether:
    vanilla: true
    custom: true
  end:
    vanilla: true
    custom: false

# --- Configuración de vegetación ---
flora:
  overworld:
    vanilla: true
    custom: false
    density: 0.8
  nether:
    vanilla: true
    custom: true
    density: 1.3 # Más vegetación del Nether
  end:
    vanilla: true
    custom: false
    density: 0.7

# --- Configuración de cuevas ---
caves:
  overworld:
    enabled: true
    vanilla-caves: true
    custom-cave-biomes: false
    density: 0.8
  nether:
    enabled: true
    vanilla-caves: true
    custom-cave-biomes: true
    density: 1.5 # Cuevas más densas
  end:
    enabled: false

# --- Configuración de ríos ---
rivers:
  overworld:
    enabled: true
    width: 6
    depth: 3
  nether:
    enabled: false
  end:
    enabled: false

# --- Configuración de islas flotantes ---
floating-islands:
  overworld:
    enabled: true
    rarity: 0.08
    min-height: 40
    max-height: 120
  nether:
    enabled: false
  end:
    enabled: true

# --- Configuración de Aether Pockets (End) ---
aether-pockets:
  enabled: false # Desactivado para enfocar en Nether

# --- Configuración de Rings of Life (End) ---
rings-of-life:
  enabled: true
  ring-1-start: 1000
  ring-1-end: 1500
  ring-2-start: 1500
  ring-2-end: 2200
  ring-3-start: 2200
  ring-3-end: 3200
  ring-4-start: 3200
  ring-4-end: 50000

# --- Configuración de Dragon Pit ---
dragon-pit:
  enabled: true
  radius: 40
  depth: 20

# --- Biomas desactivados ---
disabled-biomes:
  # Overworld: simplificar
  - AETHERIA_FLOATING_ISLES
  - AETHERIA_FOLIAGE_FORTRESS
  - AETHERIA_GLOOMY_GORGE
  - AETHERIA_SNOWY_SPIRES
  - AETHERIA_CRYSTAL_CAVERNS
  - AETHERIA_MOSSY_CAVERNS
  - AETHERIA_MAGMA_CAVERNS

  # End: simplificar
  - ENDRA_AETHER_AZURE_MEADOWS
  - ENDRA_AETHER_CLARET_GROVE
  - ENDRA_AETHER_WISPY_ISLES
  - ENDRA_AETHER_BRAMBLE_WILDS
  - ENDRA_AETHER_GOLDEN_FIELDS
  - ENDRA_AETHER_FROSTBITE_WOODS
  - ENDRA_AETHER_HONEY_HEIGHTS
  - ENDRA_AETHER_ORCHARD_WOODLANDS
  - ENDRA_AETHER_FRIGID_BLUFFS
  - ENDRA_AETHER_PRISMATIC_RIDGES
  - ENDRA_STARFIELD
  - ENDRA_NEBULA
  - ENDRA_AURORA
  - ENDRA_WEBBED_VOID
  - ENDRA_VOID_SEA

# --- Biomas con rareza modificada ---
biome-rarity:
  # Overworld: menos comunes
  AETHERIA_MEADOWS: 0.8
  AETHERIA_FOREST: 0.8
  AETHERIA_PLAINS: 0.8
  AETHERIA_BIRCH_GROVE: 0.8
  AETHERIA_TAIGA: 0.8
  AETHERIA_SAVANNA: 0.8
  AETHERIA_DESERT: 0.8
  AETHERIA_JUNGLE: 0.7
  AETHERIA_TUNDRA: 0.8
  AETHERIA_OCEAN: 0.8
  AETHERIA_DEEP_OCEAN: 0.8
  AETHERIA_LUSH_CAVES: 0.7
  AETHERIA_DRIPSTONE_CAVES: 0.7
  AETHERIA_SCORCHED_PLAINS: 1.2 # Más común (conexión con Nether)
  AETHERIA_VOID_TAINTED: 0.6

  # Nether: más comunes
  NETHERRA_FLAMING_HELLSCAPES: 1.5
  NETHERRA_SOUL_VALLEY: 1.5
  NETHERRA_CRIMSON_FOREST: 1.5
  NETHERRA_WARPED_FOREST: 1.5
  NETHERRA_BASALTIC_DELTAS: 1.3
  NETHERRA_BLOODY_REMNANTS: 1.3
  NETHERRA_CORRUPTED_WASTES: 1.4
  NETHERRA_CRYSTALLINE_VELDTS: 1.2
  NETHERRA_LIFELESS_SPIRES: 1.3
  NETHERRA_SERRATED_MOUNTAINS: 1.2
  NETHERRA_TORRID_CRAGS: 1.3
  NETHERRA_BLOODLESS_UNDERGROWTH: 1.3
  NETHERRA_THE_BOUNDARY: 1.0
  NETHERRA_OVERGROWN_CAVERNS: 1.2
  NETHERRA_END_TAINTED: 1.0
  NETHERRA_OVERWORLD_REMNANTS: 1.1
  NETHERRA_AETHER_POCKETS: 0.8

  # End: menos comunes
  ENDRA_END_HIGHLANDS: 0.7
  ENDRA_SHATTERED_END: 0.7
  ENDRA_DARK_END: 0.7
  ENDRA_AMETHYST_END: 0.6
  ENDRA_TAINTED_END: 0.6
  ENDRA_CHORUVE_WOODS: 0.6
  ENDRA_MAUVE_JUNGLE: 0.5
  ENDRA_TWISTED_GROVE: 0.6
  ENDRA_IVORY_EMPYREAN: 0.6
  ENDRA_ROSETTE_POOLS: 0.6
  ENDRA_VERMILION_WILDS: 0.5
